<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">coolify.Net logo</title>
  <desc id="desc">A vector logo showing a server stack, snowflake and orbital ring for the coolify.Net .NET library.</desc>

  <defs>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70F5FF"/>
      <stop offset=".48" stop-color="#10BFEF"/>
      <stop offset="1" stop-color="#1475E8"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B7FF"/>
      <stop offset=".5" stop-color="#B56CFF"/>
      <stop offset="1" stop-color="#7136D9"/>
    </linearGradient>
    <linearGradient id="server" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4B91"/>
      <stop offset="1" stop-color="#07152F"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#285FA7"/>
      <stop offset="1" stop-color="#0B2148"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#CFFFFF"/>
      <stop offset=".28" stop-color="#36E7FF"/>
      <stop offset="1" stop-color="#0786D8"/>
    </radialGradient>
    <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main orbital platform -->
  <ellipse cx="512" cy="455" rx="335" ry="122" fill="#071A39" stroke="#0A3E77" stroke-width="8"/>
  <ellipse cx="512" cy="447" rx="357" ry="132"
           fill="none" stroke="url(#cyanBlue)" stroke-width="22"
           transform="rotate(-8 512 447)"/>
  <path d="M174 470 C268 558 640 599 827 428"
        fill="none" stroke="url(#purple)" stroke-width="18"
        stroke-linecap="round" filter="url(#glowPurple)"/>
  <path d="M192 412 C265 297 543 260 758 345"
        fill="none" stroke="url(#cyanBlue)" stroke-width="12"
        stroke-linecap="round"/>

  <!-- Orbiting orb -->
  <circle cx="300" cy="300" r="27" fill="url(#orb)" stroke="#0879C7" stroke-width="5" filter="url(#glowBlue)"/>
  <circle cx="291" cy="291" r="8" fill="#EFFFFF" opacity=".9"/>

  <!-- Server stack -->
  <g stroke="#07152F" stroke-width="7" stroke-linejoin="round">
    <!-- bottom -->
    <path d="M267 416 L459 387 L550 415 L358 452 Z" fill="#12366D"/>
    <path d="M267 416 L267 486 L358 516 L358 452 Z" fill="url(#server)"/>
    <path d="M358 452 L550 415 L550 482 L358 516 Z" fill="url(#face)"/>
    <!-- middle -->
    <path d="M267 349 L459 320 L550 348 L358 385 Z" fill="#17447F"/>
    <path d="M267 349 L267 419 L358 449 L358 385 Z" fill="url(#server)"/>
    <path d="M358 385 L550 348 L550 415 L358 449 Z" fill="url(#face)"/>
    <!-- top -->
    <path d="M267 282 L459 253 L550 281 L358 318 Z" fill="#1C4E91"/>
    <path d="M267 282 L267 352 L358 382 L358 318 Z" fill="url(#server)"/>
    <path d="M358 318 L550 281 L550 348 L358 382 Z" fill="url(#face)"/>
  </g>

  <!-- Server vents and status LEDs -->
  <g fill="#7AA4D8">
    <rect x="286" y="302" width="10" height="19" rx="3"/>
    <rect x="304" y="299" width="10" height="19" rx="3"/>
    <rect x="322" y="296" width="10" height="19" rx="3"/>
    <rect x="286" y="369" width="10" height="19" rx="3"/>
    <rect x="304" y="366" width="10" height="19" rx="3"/>
    <rect x="322" y="363" width="10" height="19" rx="3"/>
    <rect x="286" y="436" width="10" height="19" rx="3"/>
    <rect x="304" y="433" width="10" height="19" rx="3"/>
    <rect x="322" y="430" width="10" height="19" rx="3"/>
  </g>
  <g stroke="#07152F" stroke-width="4">
    <circle cx="479" cy="300" r="9" fill="#9CFF8C"/>
    <circle cx="504" cy="296" r="9" fill="#7DE7FF"/>
    <circle cx="529" cy="291" r="9" fill="#D49CFF"/>
    <circle cx="479" cy="367" r="9" fill="#9CFF8C"/>
    <circle cx="504" cy="363" r="9" fill="#7DE7FF"/>
    <circle cx="529" cy="359" r="9" fill="#D49CFF"/>
    <circle cx="479" cy="434" r="9" fill="#9CFF8C"/>
    <circle cx="504" cy="430" r="9" fill="#7DE7FF"/>
    <circle cx="529" cy="425" r="9" fill="#D49CFF"/>
  </g>

  <!-- Snowflake -->
  <g fill="none" stroke="url(#cyanBlue)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
     filter="url(#glowBlue)">
    <path d="M625 244 L625 450"/>
    <path d="M522 347 L728 347"/>
    <path d="M552 274 L698 420"/>
    <path d="M698 274 L552 420"/>
    <path d="M625 244 L604 266 M625 244 L646 266"/>
    <path d="M625 450 L604 429 M625 450 L646 429"/>
    <path d="M522 347 L550 326 M522 347 L550 368"/>
    <path d="M728 347 L700 326 M728 347 L700 368"/>
    <path d="M552 274 L556 305 M552 274 L583 278"/>
    <path d="M698 420 L667 416 M698 420 L694 389"/>
    <path d="M698 274 L667 278 M698 274 L694 305"/>
    <path d="M552 420 L583 416 M552 420 L556 389"/>
  </g>
  <circle cx="625" cy="347" r="13" fill="#E8FFFF"/>

  <!-- Small vector sparkles -->
  <g fill="#E9FFFF">
    <path d="M420 255 l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/>
    <path d="M759 400 l4 9 9 4-9 4-4 9-4-9-9-4 9-4z"/>
    <path d="M387 393 l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <circle cx="728" cy="238" r="4"/>
    <circle cx="745" cy="263" r="3"/>
    <circle cx="402" cy="286" r="3"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="512" y="668" font-size="104" letter-spacing="-5"
          fill="url(#cyanBlue)" stroke="#06152F" stroke-width="12" paint-order="stroke">coolify</text>
    <text x="755" y="668" font-size="104" letter-spacing="-5"
          fill="url(#purple)" stroke="#06152F" stroke-width="12" paint-order="stroke">.Net</text>
  </g>

  <!-- Subtle baseline accent -->
  <path d="M302 706 C425 726 599 726 722 706"
        fill="none" stroke="#123D70" stroke-width="7" stroke-linecap="round"/>
</svg>
